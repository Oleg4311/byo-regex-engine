[package]
name = "byo-regex-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Движок регулярных выражений с нуля: разбор, байткод, Pike VM за линейное время и классический откат для сравнения"
license = "MIT"
repository = "https://github.com/Oleg4311/byo-regex-engine"
readme = "README.md"
keywords = ["regex", "nfa", "pike-vm", "education"]
categories = ["text-processing", "algorithms"]

[lib]
name = "byo_regex"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "bre"
path = "src/main.rs"

[dev-dependencies]
regex = "1"
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-wasm]
inherits = "release"
opt-level = "s"
