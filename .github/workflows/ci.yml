name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show
      - name: Форматирование
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Clippy без предупреждений
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings
      - name: Тесты (дифференциальные — 5000 случаев на каждое свойство)
        run: cargo test --all-targets
        env:
          PROPTEST_CASES: "5000"
      - run: cargo test --doc
      - name: Сравнение скорости с крейтом regex
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --release --example bench | tee bench.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: bench
          path: bench.txt

  # Минимальная поддерживаемая версия Rust собирает библиотеку и CLI
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.82 --profile minimal
      - run: cargo +1.82 build --lib --bins

  # Браузерные сценарии и доступность (axe) на локальной сборке WebAssembly
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
