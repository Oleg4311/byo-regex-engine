name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  # Тесты и проверка версии до сборки бинарников
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Версия в Cargo.toml должна совпадать с тегом
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - run: cargo test --all-targets

  build:
    needs: gate
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-amd64, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, name: darwin-arm64, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, name: darwin-amd64, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-amd64, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --bin bre --target ${{ matrix.target }}
      - name: Упаковка
        shell: bash
        run: |
          name="bre-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/bre${{ matrix.ext }}" "README.md" "LICENSE" "dist/$name/"
          if [ "${{ matrix.name }}" = windows-amd64 ]; then (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null); else tar -C dist -czf "dist/$name.tar.gz" "$name"; fi
          ls -la dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bre-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: bre-*
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS && cat SHA256SUMS)
      - name: Подтверждение происхождения (provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY"
          --title "bre $GITHUB_REF_NAME"
          --notes "CLI bre: поиск по строкам, байткод (--explain), сравнение движков (--engine pike|backtrack|memo). Проверьте SHA-256 из SHA256SUMS и аттестацию: gh attestation verify <файл> --repo Oleg4311/byo-regex-engine. Подробнее в README."
